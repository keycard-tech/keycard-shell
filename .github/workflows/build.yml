name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version'
        required: true
        default: 'v1.0.0'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.vars.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            release="${{ github.event.release.tag_name }}"
          else
            release="${{ github.event.inputs.release }}"
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "version=${release#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libpcsclite-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python virtual environment
        run: |
          uv venv
          uv sync

      - name: Download ARM GCC toolchain
        run: |
          chmod +x tools/download-toolchain.sh
          ./tools/download-toolchain.sh

      - name: Create deployment directory with signing keys
        run: |
          mkdir -p deployment
          PRIVATE_KEY=$(openssl rand -hex 32)
          PUBLIC_KEY=$(openssl rand -hex 64)
          echo "$PRIVATE_KEY" > deployment/fw-test-key.txt
          echo "$PUBLIC_KEY" > deployment/bootloader-pubkey.txt

      - name: Configure build
        run: |
          cmake --preset=release

      - name: Build firmware
        run: |
          cmake --build --preset=release

      - name: Copy signed binary
        run: |
          cp build/shellos.bin shellos-${{ steps.vars.outputs.release }}-reproduction.bin

      - name: Copy bootloader binary
        run: |
          cp build/shellos-bootloader.bin shellos-bootloader-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.version }}.bin

      - name: Generate checksums
        run: |
          set -e
          boot_bin="shellos-bootloader-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.version }}.bin"
          fw_bin="shellos-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.version }}.bin"
          # The firmware hash skips the signature bytes (bootloader-compatible), the
          # bootloader is unsigned, so a plain SHA256 is enough for it.
          fw_hash=$(uv run python tools/firmware-hash.py -b build/shellos.bin)
          boot_hash=$(sha256sum "${boot_bin}" | cut -d' ' -f1)
          {
            echo "# Format: <sha256>  <filename>"
            echo "#"
            echo "# The firmware hash is computed by tools/firmware-hash.py (the same hash the"
            echo "# bootloader verifies at boot), which skips the 64 signature bytes at offset 588,"
            echo "# so a plain sha256sum does NOT reproduce it. Verify it with:"
            echo "#   python3 tools/firmware-hash.py -b ${fw_bin}"
            echo "#"
            echo "# The bootloader is unsigned and uses a plain SHA256, which can be verified with:"
            echo "#   sha256sum -c --ignore-missing <this file>"
            echo "${fw_hash}  ${fw_bin}"
            echo "${boot_hash}  ${boot_bin}"
          } > shellos-${{ steps.vars.outputs.release }}-sha256.txt

      - name: Upload signed binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: shellos-${{ steps.vars.outputs.release }}-reproduction
          path: shellos-${{ steps.vars.outputs.release }}-reproduction.bin

      - name: Upload bootloader artifact
        uses: actions/upload-artifact@v4
        with:
          name: shellos-${{ steps.vars.outputs.release }}-bootloader
          path: shellos-bootloader-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.version }}.bin

      - name: Upload hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: shellos-${{ steps.vars.outputs.release }}-sha256
          path: shellos-${{ steps.vars.outputs.release }}-sha256.txt

  # Attach the automatically verifiable files to the release. The signed firmware is
  # intentionally left out here, since it has to be signed with the production keys and
  # uploaded manually.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bootloader artifact
        uses: actions/download-artifact@v4
        with:
          name: shellos-${{ needs.build.outputs.release }}-bootloader
          path: assets

      - name: Download hash artifact
        uses: actions/download-artifact@v4
        with:
          name: shellos-${{ needs.build.outputs.release }}-sha256
          path: assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.build.outputs.release }}" assets/* --clobber
